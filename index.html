<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="E-TRACK – Scooter GPS Tracking">
  <title>E-TRACK</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo-mark">E</div>
        <div><h1>E-TRACK</h1><p>RIDE. TRACK. REPEAT.</p></div>
      </div>
      <button class="icon-btn" id="settings" aria-label="Einstellungen">⚙</button>
    </header>

    <section id="homeScreen" class="screen">
      <section class="hero-card">
        <div class="gps-label"><span class="status-dot"></span><span id="gpsStatus">GPS BEREIT</span></div>
        <h2>Bereit für die nächste Fahrt?</h2>
        <p>Zeichne deine Strecke live auf und speichere sie für später.</p>
      </section>
      <button class="primary" id="startRide">🛴 Fahrt starten</button>
      <button class="secondary" id="routes">Meine Routen</button>
    </section>

    <section id="rideScreen" class="screen hidden">
      <div class="map-wrap"><div id="map"></div></div>
      <div class="stats">
        <div><span>Zeit</span><strong id="time">00:00:00</strong></div>
        <div><span>Distanz</span><strong id="distance">0.00 km</strong></div>
        <div><span>GPS</span><strong id="accuracy">–</strong></div>
      </div>
      <button class="primary stop" id="stopRide">Fahrt beenden</button>
    </section>

    <section id="routesScreen" class="screen hidden">
      <div class="section-head"><button class="back" id="backHome">‹</button><h2>Meine Routen</h2></div>
      <div id="routeList" class="route-list"></div>
    </section>

    <footer>E-TRACK V0.2 · BETA</footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
