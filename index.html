<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="E-TRACK – Ride. Track. Repeat.">
  <title>E-TRACK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="brand">
      <div class="logo-mark">E</div>
      <div>
        <h1>E-TRACK</h1>
        <p>RIDE. TRACK. REPEAT.</p>
      </div>
    </div>

    <section class="hero-card">
      <div class="status-dot"></div>
      <span>GPS TRACKING</span>
      <h2>Bereit für die nächste Fahrt?</h2>
      <p>Zeichne deine Scooter-Routen auf und speichere sie für später.</p>
    </section>

    <button class="primary" id="startRide">Fahrt starten</button>
    <button class="secondary" id="routes">Meine Routen</button>

    <footer>E-TRACK V0.1 · BETA</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
